name: Build & Release Test APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Publish Android APK to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Run static code analysis
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Prepare APK Release Artifacts
        run: |
          mkdir -p release_apks
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/Beauty-in-Shadow-v1.0.0-release.apk
          cp build/app/outputs/flutter-apk/app-debug.apk release_apks/Beauty-in-Shadow-v1.0.0-debug.apk
          ls -la release_apks/

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Beauty-in-Shadow-APKs
          path: release_apks/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "Beauty in Shadow: Dual Reign v1.0.0"
          body: |
            ## 🎮 Beauty in Shadow: Dual Reign — Android APK Release

            Bienvenue dans les bas-fonds néo-noirs et les intrigues de cour de **Beauty in Shadow: Dual Reign**.

            ### 📦 Fichiers APK disponibles au téléchargement :
            - **`Beauty-in-Shadow-v1.0.0-release.apk`** : Version Release optimisée (recommandée, avec minification & ProGuard activés).
            - **`Beauty-in-Shadow-v1.0.0-debug.apk`** : Version Debug de test.

            ### 📱 Guide d'installation sur Android :
            1. Téléchargez le fichier **`.apk`** ci-dessous sur votre smartphone Android.
            2. Ouvrez le fichier téléchargé pour démarrer l'installation.
            3. Si demandé par Android, activez l'option **"Autoriser l'installation d'applications de sources inconnues"** pour votre navigateur / gestionnaire de fichiers.
            4. Lancez le jeu et commencez votre règne !
          draft: false
          prerelease: false
          files: |
            release_apks/Beauty-in-Shadow-v1.0.0-release.apk
            release_apks/Beauty-in-Shadow-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
